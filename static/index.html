<!doctype html>
<html lang="ru" data-palette="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KvizY</title>
<meta name="description" content="Квизы по своим лекциям и конспектам">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="KvizY">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<!-- Экраны запуска iOS (классическая палитра); после них сразу появляется наш экран в цветах палитры -->
<link rel="apple-touch-startup-image" media="(device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3)" href="/static/icons/splash-1290x2796.png">
<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3)" href="/static/icons/splash-1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3)" href="/static/icons/splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2)" href="/static/icons/splash-750x1334.png">
<link rel="apple-touch-startup-image" media="(device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2)" href="/static/icons/splash-1640x2360.png">
<link rel="apple-touch-startup-image" media="(device-width: 834px) and (device-height: 1194px) and (-webkit-device-pixel-ratio: 2)" href="/static/icons/splash-1668x2388.png">
<link rel="apple-touch-startup-image" media="(device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2)" href="/static/icons/splash-2048x2732.png">
<script>
  // Палитру ставим ДО отрисовки, чтобы не мигал белый экран.
  (function () {
    var p = "classic";
    try { p = localStorage.getItem("kvizy.palette") || "classic"; } catch (e) {}
    document.documentElement.setAttribute("data-palette", p);
    var colors = {classic:"#ffffff",dark:"#121212",beige:"#f4ede1",bluegray:"#edf1f5",sage:"#edf1ea",terminal:"#050a05",sakura:"#fff4f6",desert:"#f2e5cf",deep:"#0a1828",neon:"#0c0a19"};
    document.querySelector('meta[name="theme-color"]').setAttribute("content", colors[p] || "#ffffff");
  })();
</script>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="boot" id="boot"><div class="logo">KvizY</div><div class="spinner"></div><div class="muted" id="boot-text">открываю…</div></div>

<header class="topbar">
  <button class="menu-btn" id="menu-btn" aria-label="Меню" aria-expanded="false">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
  </button>
  <div class="title" id="top-title">KvizY</div>
</header>
<div class="drawer-shade" id="drawer-shade"></div>
<nav class="drawer" id="drawer" aria-label="Страницы">
  <div class="brand">KvizY</div>
  <a href="#/" data-nav="home">Главная</a>
  <a href="#/create" data-nav="create">Создать квиз</a>
  <a href="#/history" data-nav="history">История</a>
  <a href="#/stats" data-nav="stats">Статистика</a>
  <a href="#/subjects" data-nav="subjects">Предмет</a>
  <a href="#/settings" data-nav="settings">Настройки</a>
</nav>
<main id="view"></main>
<script src="/static/app.js"></script>
</body>
</html>
